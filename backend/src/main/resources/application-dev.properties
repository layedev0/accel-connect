spring.application.name=accel-connect
server.port=${SERVER_PORT:8085}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:}
jwt.auth.converter.resource-id=${KEYCLOAK_RESOURCE_ID}
jwt.auth.converter.principal-attribute=preferred_username

spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Birthday notifications — days before a birthday to notify HR managers
app.birthday.lead-days=${BIRTHDAY_LEAD_DAYS:2}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

spring.task.scheduling.time-zone=Africa/Dakar
spring.task.scheduling.enabled=true

spring.jpa.show-sql=false
# Le schema est gere par Flyway (db/migration). Hibernate ne le modifie plus : il verifie
# qu'il correspond aux entites et refuse de demarrer en cas d'ecart.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Base deja peuplee et sans table d'historique : Flyway l'estampille en V1 sans rejouer le
# script, puis applique V2 et suivants. Sur une base vide, V1 s'execute normalement.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema existant avant adoption de Flyway

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

logging.level.root=WARN
logging.level.heritage.africca.accel_connect=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Nextcloud Talk – notifications
nextcloud.url=https://omni365.heritage.africa
nextcloud.username=notif
nextcloud.password=

# Leave observer notifications
app.leave.observer.emails=${LEAVE_OBSERVER_EMAIL:}

# Senegal public holidays
# Update each year when officially announced. Format: yyyy-MM-dd,yyyy-MM-dd,...
app.holidays.senegal.islamic.2025=2025-03-31,2025-06-07,2025-07-07,2025-09-05
app.holidays.senegal.islamic.2026=2026-03-21,2026-05-27,2026-06-26,2026-09-15
