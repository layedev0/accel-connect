spring.application.name=accel-connect
server.port=8085

# Database Configuration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:accel_connect_db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.sql.init.mode=never


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.jpa.hibernate.ddl-auto=create-drop

# Les tests tournent sur H2 ; la ligne de base est du PostgreSQL pur et n'y passerait pas.
# Le schema de test reste produit par create-drop ci-dessus.
spring.flyway.enabled=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

#Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/accel

# Nextcloud Talk (stub values for test context — HTTP calls are never made in unit tests)
nextcloud.url=http://localhost:9999
nextcloud.username=test-bot
nextcloud.password=test-password
